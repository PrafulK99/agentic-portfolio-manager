<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuantAI - Portfolio Manager</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-tertiary-container": "#ffede6",
              "inverse-surface": "#2e3039",
              "surface-container-high": "#e7e7f3",
              "tertiary-container": "#bc4800",
              "on-primary-fixed": "#00174b",
              "error": "#ba1a1a",
              "secondary": "#006c4a",
              "outline": "#737686",
              "on-secondary-fixed": "#002114",
              "surface-container-highest": "#e1e2ed",
              "primary-fixed": "#dbe1ff",
              "surface-variant": "#e1e2ed",
              "error-container": "#ffdad6",
              "tertiary": "#943700",
              "secondary-fixed": "#85f8c4",
              "surface-tint": "#0053db",
              "on-tertiary": "#ffffff",
              "surface-container-lowest": "#ffffff",
              "inverse-on-surface": "#f0f0fb",
              "primary": "#004ac6",
              "on-background": "#191b23",
              "on-primary-fixed-variant": "#003ea8",
              "on-primary": "#ffffff",
              "on-error-container": "#93000a",
              "surface-container-low": "#f3f3fe",
              "surface-bright": "#faf8ff",
              "primary-container": "#2563eb",
              "outline-variant": "#c3c6d7",
              "inverse-primary": "#b4c5ff",
              "on-tertiary-fixed-variant": "#7d2d00",
              "on-secondary": "#ffffff",
              "on-surface-variant": "#434655",
              "on-error": "#ffffff",
              "on-primary-container": "#eeefff",
              "tertiary-fixed-dim": "#ffb596",
              "on-secondary-container": "#00714e",
              "background": "#faf8ff",
              "primary-fixed-dim": "#b4c5ff",
              "on-secondary-fixed-variant": "#005137",
              "surface": "#faf8ff",
              "secondary-fixed-dim": "#68dba9",
              "tertiary-fixed": "#ffdbcd",
              "secondary-container": "#82f5c1",
              "on-surface": "#191b23",
              "surface-container": "#ededf9",
              "on-tertiary-fixed": "#360f00",
              "surface-dim": "#d9d9e5"
            },
            borderRadius: {
              "DEFAULT": "0.25rem",
              "lg": "0.5rem",
              "xl": "0.75rem",
              "full": "9999px"
            },
            spacing: {
              "gutter": "24px",
              "container-max": "1280px",
              "margin-desktop": "40px",
              "margin-mobile": "16px",
              "base": "8px"
            },
            fontFamily: {
              "body-sm": ["Inter"],
              "label-caps": ["JetBrains Mono"],
              "headline-lg": ["Hanken Grotesk"],
              "body-md": ["Inter"],
              "headline-lg-mobile": ["Hanken Grotesk"],
              "display-lg": ["Hanken Grotesk"]
            },
            fontSize: {
              "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
              "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }],
              "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
              "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
              "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
              "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }]
            }
          }
        }
      }
    </script>
    <style>
      .glass-panel {
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
      }
      .gauge-circle {
        background: conic-gradient(var(--tw-colors-primary) calc(var(--percentage) * 1%), var(--tw-colors-surface-container-high) 0);
        border-radius: 50%;
      }
      .material-symbols-outlined {
        font-family: 'Material Symbols Outlined';
        font-weight: normal;
        font-style: normal;
        font-size: 24px;
        display: inline-block;
        line-height: 1;
        text-transform: none;
        letter-spacing: normal;
        word-wrap: normal;
        white-space: nowrap;
        direction: ltr;
      }
    </style>
  </head>
  <body class="bg-surface text-on-surface font-body-md text-body-md">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
